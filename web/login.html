<!DOCTYPE html>
<html lang="en" class="authed">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Admin - Sign in</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/login.js"></script>
</head>
<body>
    <div class="admin-container login-container">
        <header class="admin-header">
            <h1>📚 Library Admin</h1>
            <p>Sign in to continue</p>
        </header>

        <section class="registration-section">
            <h2>Sign in</h2>
            <form class="registration-form" id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email:</label>
                    <input type="email" id="loginEmail" name="email" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password:</label>
                    <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" id="loginBtn" class="btn-primary">Sign in</button>
                <div id="loginMessage" class="status-message"></div>
            </form>
        </section>
    </div>
</body>
</html>
