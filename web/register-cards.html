<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Cards</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/firebase-config.js"></script>
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>Register RFID Cards</h1>
            <p>Add card holders to the system</p>
            <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                <a class="tab-btn" href="dashboard.html">Dashboard</a>
                <a class="tab-btn active" href="register-cards.html">Register Cards</a>
                <a class="tab-btn" href="register-books.html">Register Books</a>
                <a class="tab-btn" href="relay.html">Barcode Relay</a>
                <a class="tab-btn" href="data.html">Saved Data</a>
            </div>
        </header>

        <!-- RFID Scanner Input Section -->
        <section class="registration-section" style="margin-top: 0;">
            <h2>📡 RFID Scanner Input</h2>
            <div id="rfidSyncArea" style="padding: 20px; background: #f8f9fa; border-radius: 8px; border: 2px dashed #ddd;">
                <p style="color: #666; margin-bottom: 15px;">Tap RFID card on ESP32 to automatically fill Card ID:</p>
                <div id="rfidStatus" style="padding: 15px; background: white; border-radius: 6px;">
                    <p style="color: #999; font-style: italic;">Waiting for RFID card scan...</p>
                </div>
            </div>
        </section>

        <section class="registration-section">
            <h2>Register New Card</h2>
            <form class="registration-form" id="cardForm">
                <div class="form-group">
                    <label for="cardId">Card ID / RFID Number:</label>
                    <input type="text" id="cardId" name="cardId" placeholder="Enter card ID or tap card on ESP32" required>
                </div>
                
                <div class="form-group">
                    <label for="cardName">Card Holder Name:</label>
                    <input type="text" id="cardName" name="cardName" placeholder="Enter card holder name" required>
                </div>
                
                <div class="form-group">
                    <label for="cardEmail">Email:</label>
                    <input type="email" id="cardEmail" name="cardEmail" placeholder="Enter email address">
                </div>
                
                <div class="form-group">
                    <label for="cardPhone">Phone Number:</label>
                    <input type="tel" id="cardPhone" name="cardPhone" placeholder="Enter phone number">
                </div>
                
                <div class="form-group">
                    <label for="cardStatus">Status:</label>
                    <select id="cardStatus" name="cardStatus">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="suspended">Suspended</option>
                    </select>
                </div>
                
                <button type="submit" id="cardSubmitBtn" class="btn-primary">Register Card</button>
                <div id="cardStatusMessage" class="status-message"></div>
            </form>
        </section>

        <section class="view-section">
            <div class="view-header">
                <h2>Registered Cards</h2>
            </div>
            <div id="cardsList" class="items-list">
                <p class="loading-text">Loading cards...</p>
            </div>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
